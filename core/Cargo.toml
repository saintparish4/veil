[package]
name = "veil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Veil — Solidity smart-contract security scanner (library + CLI)."
homepage = "https://github.com/saintparish4/veil"
documentation = "https://github.com/saintparish4/veil"
readme = "../README.md"
keywords = ["solidity", "security", "scanner", "static-analysis", "ethereum"]
categories = ["development-tools", "cryptography::cryptocurrencies"]
[lib]
name = "veil"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = ["cli"]
# Terminal rendering only. The CLI itself lives in the `veil-cli` package,
# which is the one layer permitted to depend on every crate in the workspace.
cli = ["dep:colored"]

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-solidity = { workspace = true }
tree-sitter-language = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
toml = { workspace = true }
colored = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]] 
name = "scan_bench" 
harness = false 