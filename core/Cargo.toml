[package]
name = "veil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Veil — Solidity smart-contract security scanner (library + CLI)."
homepage = "https://github.com/saintparish4/veil"
documentation = "https://github.com/saintparish4/veil"
readme = "../README.md"
keywords = ["solidity", "security", "scanner", "static-analysis", "ethereum"]
categories = ["development-tools", "cryptography::cryptocurrencies"]
# Make `cargo run -p veil` and `cargo install` resolve to the scanner
# without an explicit --bin.
default-run = "veil"

# Lets `cargo binstall veil` fetch the prebuilt release archives produced by
# .github/workflows/release.yml instead of compiling from source. The asset
# naming here must match the `archive: veil-$target` in that workflow.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "veil"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "veil"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:colored", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-solidity = { workspace = true }
tree-sitter-language = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
toml = { workspace = true }
colored = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]] 
name = "scan_bench" 
harness = false 